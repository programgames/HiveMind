# Pre-commit configuration for HiveMind
# See https://pre-commit.com for more information
# Install: pip install pre-commit
# Setup: pre-commit install

repos:
  # Local hooks for Lua-specific tests
  - repo: local
    hooks:
      # Lua syntax validation
      - id: lua-syntax-check
        name: Lua Syntax Check
        entry: lua
        args: ['-e', 'local files = {"main.lua", "test_planning.lua", "test_example.lua", "test_genome.lua", "test_state.lua", "test_species.lua", "lib/genome.lua", "lib/state.lua", "lib/species.lua", "lib/jobs.lua", "test_jobs.lua", "lib/config.lua", "lib/transport.lua", "lib/machines.lua", "test_transport.lua", "test_machines.lua", "lib/library.lua", "test_library.lua", "lib/breeding.lua", "test_breeding.lua", "hivemind.lua", "lib/planner.lua", "test_planner.lua", "lib/data/mutations.lua", "tools/calibrate.lua", "tools/upload.lua", "tools/autoreport.lua"}; local errors = false; for _, file in ipairs(files) do local f = io.open(file, "r"); if f then local content = f:read("*all"); f:close(); local func, err = load(content, file); if not func then print("❌ Syntax error in " .. file .. ": " .. err); errors = true; else print("✅ " .. file .. " syntax OK"); end; else print("⚠️  Could not read " .. file); end; end; if errors then os.exit(1); end']
        language: system
        files: '\.lua$'
        pass_filenames: false

      - id: hivemind-planner-tests
        name: HiveMind Chain Planner Tests
        entry: lua
        args: ['test_planner.lua']
        language: system
        files: '(lib/planner|test_planner)\.lua$'
        pass_filenames: false
      - id: hivemind-breeding-tests
        name: HiveMind Breeding Cycle Tests
        entry: lua
        args: ['test_breeding.lua']
        language: system
        files: '(lib/breeding|lib/machines|lib/transport|lib/jobs|lib/config|test_breeding)\.lua$'
        pass_filenames: false
      # Transport and machine layer tests
      - id: hivemind-transport-tests
        name: HiveMind Transport Tests
        entry: lua
        args: ['test_transport.lua']
        language: system
        files: '(lib/transport|test_transport)\.lua$'
        pass_filenames: false

      - id: hivemind-machines-tests
        name: HiveMind Machine Tests
        entry: lua
        args: ['test_machines.lua']
        language: system
        files: '(lib/machines|lib/config|lib/genome|test_machines)\.lua$'
        pass_filenames: false

      - id: hivemind-library-tests
        name: HiveMind Gene Library Tests
        entry: lua
        args: ['test_library.lua']
        language: system
        files: '(lib/library|lib/genome|lib/state|test_library)\.lua$'
        pass_filenames: false

      # Job queue tests (resume, idempotence)
      - id: hivemind-jobs-tests
        name: HiveMind Job Queue Tests
        entry: lua
        args: ['test_jobs.lua']
        language: system
        files: '(lib/jobs|lib/state|test_jobs)\.lua$'
        pass_filenames: false

      # Persistence layer tests
      - id: hivemind-state-tests
        name: HiveMind State Tests
        entry: lua
        args: ['test_state.lua']
        language: system
        files: '(lib/state|test_state)\.lua$'
        pass_filenames: false

      # Species registry tests
      - id: hivemind-species-tests
        name: HiveMind Species Tests
        entry: lua
        args: ['test_species.lua']
        language: system
        files: '(lib/species|lib/state|test_species)\.lua$'
        pass_filenames: false

      # Genome layer tests (NBT parsing, sample labels, profiles)
      - id: hivemind-genome-tests
        name: HiveMind Genome Tests
        entry: lua
        args: ['test_genome.lua']
        language: system
        files: '(lib/genome|test_genome)\.lua$'
        pass_filenames: false

      # Item detection tests (labels, stack sizes, key codes)
      - id: hivemind-detection-tests
        name: HiveMind Item Detection Tests
        entry: lua
        args: ['-e', 'package.path = package.path .. ";./?.lua"; local test_planning = require("test_planning"); print("Running HiveMind item detection tests..."); local success = test_planning.testItemDetection(); if not success then print("❌ Item detection tests failed"); os.exit(1); else print("✅ Item detection tests passed"); end']
        language: system
        files: '(main|test_planning)\.lua$'
        pass_filenames: false

      # Core planning tests
      - id: hivemind-planning-tests
        name: HiveMind Planning Tests
        entry: lua
        args: ['-e', 'package.path = package.path .. ";./?.lua"; local test_planning = require("test_planning"); print("Running HiveMind planning tests..."); local success = test_planning.runAllTests(); if not success then print("❌ Planning tests failed"); os.exit(1); else print("✅ Planning tests passed"); end']
        language: system
        files: '(main|test_planning)\.lua$'
        pass_filenames: false

      # Execution tests
      - id: hivemind-execution-tests
        name: HiveMind Execution Tests
        entry: lua
        args: ['-e', 'package.path = package.path .. ";./?.lua"; local test_planning = require("test_planning"); print("Running HiveMind execution tests..."); local success = test_planning.testExecuteBreedingTree(); if not success then print("❌ Execution tests failed"); os.exit(1); else print("✅ Execution tests passed"); end']
        language: system
        files: '(main|test_planning)\.lua$'
        pass_filenames: false

      # Error handling tests
      - id: hivemind-error-handling
        name: HiveMind Error Handling Tests
        entry: lua
        args: ['-e', 'package.path = package.path .. ";./?.lua"; local test_planning = require("test_planning"); print("Running HiveMind error handling tests..."); test_planning.testExecuteBreedingTreeErrorHandling(); print("✅ Error handling tests completed");']
        language: system
        files: '(main|test_planning)\.lua$'
        pass_filenames: false

      # Example usage validation
      - id: hivemind-example-tests
        name: HiveMind Example Tests
        entry: lua
        args: ['test_example.lua']
        language: system
        files: 'test_example\.lua$'
        pass_filenames: false

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Basic file checks
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        files: '\.(yaml|yml)$'
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-merge-conflict

  # Optional: Performance tests (only run manually)
  - repo: local
    hooks:
      - id: hivemind-performance-tests
        name: HiveMind Performance Tests (Manual)
        entry: lua
        args: ['-e', 'package.path = package.path .. ";./?.lua"; local test_planning = require("test_planning"); print("Running performance tests..."); test_planning.performanceTest(); print("✅ Performance tests completed");']
        language: system
        files: '(main|test_planning)\.lua$'
        pass_filenames: false
        stages: [manual]  # Only run when explicitly requested

      - id: hivemind-stress-tests
        name: HiveMind Stress Tests (Manual)
        entry: lua
        args: ['-e', 'package.path = package.path .. ";./?.lua"; local test_planning = require("test_planning"); print("Running complexity stress tests..."); test_planning.complexityStressTest(); print("✅ Stress tests completed");']
        language: system
        files: '(main|test_planning)\.lua$'
        pass_filenames: false
        stages: [manual]  # Only run when explicitly requested

# Configuration
default_stages: [commit]
fail_fast: false  # Run all hooks even if one fails
minimum_pre_commit_version: '2.9.0'
